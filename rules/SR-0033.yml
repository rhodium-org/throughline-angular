uid: SR-0033
type: system_requirement
status: proposed
title: Use const for values that do not change
text: Declare variables with const if their values do not change during the application's
  lifetime, so intent is clear and reassignment is prevented.
normative: true
links:
- target: UR-0009
  type: implements
attrs:
