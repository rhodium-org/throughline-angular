uid: SR-0028
type: system_requirement
status: approved
title: Provide a service at the root injector
text: >-
  Provide an application-wide service with the root injector by setting providedIn to root
  in the injectable metadata, so Angular can tree-shake unused services.
links:
- target: UR-0006
  type: implements
attrs:
