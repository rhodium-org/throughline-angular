uid: SR-0005
type: system_requirement
status: approved
title: Name symbols and files consistently
text: >-
  Use consistent names for all assets named after what they represent, use upper camel
  case for class names, and match the name of the symbol to the name of the file.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "Angular Style Guide: Naming — Symbols and File Names"
