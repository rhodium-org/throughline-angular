uid: SR-0029
type: system_requirement
status: proposed
title: Use the Injectable class decorator
text: Use the injectable class decorator to declare a class's dependencies for injection,
  rather than injecting dependencies with parameter decorators where the class decorator
  suffices.
normative: true
links:
